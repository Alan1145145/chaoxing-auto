<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>超星自动机</title>
		<style>
			:root { color-scheme: light; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
			body { margin: 0; background: #f4f6f8; color: #1d2129; }
			main { max-width: 920px; margin: 0 auto; padding: 28px 20px 48px; }
			.card, .group { background: #fff; border: 1px solid #e5e6eb; border-radius: 12px; }
			.card { display: flex; justify-content: space-between; gap: 16px; align-items: center; padding: 18px 20px; }
			.label { color: #86909c; font-size: 12px; }
			.value { display: block; margin-top: 4px; font-size: 18px; font-weight: 650; }
			.meta { display: flex; gap: 16px; margin-top: 10px; color: #4e5969; font-size: 13px; }
			button { border: 0; background: #165dff; color: #fff; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
			.status { margin: 16px 0; min-height: 22px; color: #4e5969; }
			.status.warn { color: #d25f00; }
			h1 { margin: 8px 0 4px; font-size: 28px; }
			.subtitle, .hint { color: #86909c; }
			.groups { display: grid; gap: 16px; }
			.group { padding: 16px; }
			.group h2 { margin: 0 0 12px; font-size: 16px; }
			.links { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
			a { display: block; padding: 10px 12px; border-radius: 8px; background: #f7f8fa; color: inherit; text-decoration: none; }
			a:hover { background: #e8f3ff; }
		</style>
	</head>
	<body>
		<main>
			<section class="card">
				<div>
					<span class="label">当前浏览器</span>
					<strong id="browser-name" class="value">正在读取</strong>
					<div class="meta">
						<span>标签 <span id="browser-tags">-</span></span>
						<span>备注 <span id="browser-notes">-</span></span>
					</div>
				</div>
				<button id="show-in-app" type="button">在软件中显示</button>
			</section>
			<div id="status" class="status"></div>
			<h1>超星自动机</h1>
			<p class="hint">打开学习平台后，脚本会在页面里自动运行。</p>
			<div id="groups" class="groups"></div>
		</main>
		<script>
			const fallback = [
				{ group: '常用学习平台', values: [
					{ name: '超星学习通', url: 'https://i.chaoxing.com/' },
					{ name: '智慧树', url: 'https://www.zhihuishu.com/' },
					{ name: '智慧职教', url: 'https://www.icve.com.cn/' },
					{ name: '职教云', url: 'https://zjy2.icve.com.cn/' },
					{ name: '中国大学MOOC', url: 'https://www.icourse163.org/' },
					{ name: '雨课堂', url: 'https://www.yuketang.cn/' }
				]}
			];
			const params = new URLSearchParams(location.search);
			const uid = params.get('uid') || '';
			const statusEl = document.querySelector('#status');
			window.setBookmarkLoadingState = (state) => {
				const tips = Array.isArray(state && state.tips) ? state.tips.filter(Boolean) : [];
				statusEl.textContent = tips.join(' ');
				statusEl.classList.toggle('warn', Boolean(state && state.warn));
			};
			function render(groups) {
				const root = document.querySelector('#groups');
				root.replaceChildren();
				for (const group of groups) {
					const values = (group.values || []).filter((item) => item && item.name && item.url);
					if (!values.length) continue;
					const section = document.createElement('section');
					section.className = 'group';
					const title = document.createElement('h2');
					title.textContent = group.group || '网站';
					const links = document.createElement('div');
					links.className = 'links';
					for (const item of values) {
						const link = document.createElement('a');
						link.href = item.url;
						link.textContent = item.name;
						links.append(link);
					}
					section.append(title, links);
					root.append(section);
				}
			}
			render(fallback);
			document.querySelector('#show-in-app').onclick = () => {
				if (!uid) return;
				fetch('/api/bookmark/show-browser-in-app?uid=' + encodeURIComponent(uid));
			};
			if (uid) {
				fetch('/api/bookmark/browser-info?uid=' + encodeURIComponent(uid))
					.then((response) => response.json())
					.then((info) => {
						if (!info) return;
						document.querySelector('#browser-name').textContent = info.name || '未命名浏览器';
						document.querySelector('#browser-tags').textContent = (info.tags || []).map((tag) => tag.name).join('、') || '-';
						document.querySelector('#browser-notes').textContent = info.notes || '-';
					})
					.catch(() => {});
			}
			const controller = new AbortController();
			const timer = setTimeout(() => controller.abort(), 1200);
			fetch('https://cdn.ocsjs.com/api/ocs-app-infos.json', { signal: controller.signal })
				.then((response) => response.json())
				.then((info) => { if (Array.isArray(info.bookmark) && info.bookmark.length) render(info.bookmark); })
				.catch(() => {})
				.finally(() => clearTimeout(timer));
		</script>
	</body>
</html>
